<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#0d0819"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="0.18" stop-color="#ff993a"/>
      <stop offset="0.36" stop-color="#ffdd33"/>
      <stop offset="0.55" stop-color="#3ddb66"/>
      <stop offset="0.75" stop-color="#3aa1ff"/>
      <stop offset="1" stop-color="#b265ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feOffset dx="6" dy="6" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.55"/>
      <feComposite in2="off" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative gradient bar -->
  <rect x="0" y="580" width="1200" height="6" fill="url(#rainbow)" opacity="0.85"/>

  <!-- pixel logo, scaled to 120x120, top-left -->
  <g transform="translate(60 60)" shape-rendering="crispEdges">
    <g fill="#a855f7">
      <rect x="15"  y="15" width="15" height="15"/>
      <rect x="30"  y="15" width="15" height="15"/>
      <rect x="45"  y="15" width="15" height="15"/>
      <rect x="60"  y="15" width="15" height="15"/>
      <rect x="75"  y="15" width="15" height="15"/>
    </g>
    <g fill="#c084fc">
      <rect x="15" y="30" width="15" height="15"/>
      <rect x="75" y="30" width="15" height="15"/>
    </g>
    <g fill="#a855f7">
      <rect x="15" y="45" width="15" height="15"/>
      <rect x="30" y="45" width="15" height="15"/>
      <rect x="45" y="45" width="15" height="15"/>
      <rect x="60" y="45" width="15" height="15"/>
      <rect x="75" y="45" width="15" height="15"/>
    </g>
    <g fill="#7c3aed">
      <rect x="15" y="60" width="15" height="15"/>
      <rect x="75" y="60" width="15" height="15"/>
    </g>
    <g fill="#7c3aed">
      <rect x="15" y="75" width="15" height="15"/>
      <rect x="30" y="75" width="15" height="15"/>
      <rect x="45" y="75" width="15" height="15"/>
      <rect x="60" y="75" width="15" height="15"/>
      <rect x="75" y="75" width="15" height="15"/>
    </g>
  </g>

  <!-- brand label next to logo -->
  <text x="200" y="118" font-family="'Courier New', ui-monospace, monospace" font-size="26" font-weight="700" fill="#ece6ff" letter-spacing="4">KYYNET</text>
  <text x="200" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#a89fc7" letter-spacing="2">MINECRAFT TOOLKIT · V1</text>

  <!-- Main title: KyyNet (white) -->
  <text
    x="600"
    y="330"
    text-anchor="middle"
    font-family="'Courier New', ui-monospace, monospace"
    font-size="150"
    font-weight="900"
    fill="#ffffff"
    filter="url(#dropShadow)"
    letter-spacing="4"
  >KyyNet</text>

  <!-- Main title: Gradient (rainbow) -->
  <text
    x="600"
    y="480"
    text-anchor="middle"
    font-family="'Courier New', ui-monospace, monospace"
    font-size="150"
    font-weight="900"
    fill="url(#rainbow)"
    filter="url(#dropShadow)"
    letter-spacing="4"
  >Gradient</text>

  <!-- Tagline -->
  <text
    x="600"
    y="545"
    text-anchor="middle"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="24"
    fill="#c7bfe3"
    letter-spacing="1.5"
  >Визуальный редактор градиентов для Minecraft</text>
</svg>
